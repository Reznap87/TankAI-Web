name: Deploy TankAI Web Public

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: tankai-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TANKAI_WORKER_NAME: tankai-web
  TANKAI_D1_DATABASE_NAME: tankai-web-production

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Deploy, migrate and externally verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TANKAI_D1_DATABASE_ID: ${{ secrets.TANKAI_D1_DATABASE_ID }}
          TANKAI_ID_SALT: ${{ secrets.TANKAI_ID_SALT }}
          TANKAI_CUSTOM_DOMAIN: ${{ vars.TANKAI_CUSTOM_DOMAIN }}
          TANKAI_PUBLIC_URL: ${{ vars.TANKAI_PUBLIC_URL }}
          TANKAI_EGRESS_ALLOWED_HOSTS: ${{ vars.TANKAI_EGRESS_ALLOWED_HOSTS }}
          TANKAI_EGRESS_DENIED_HOSTS: ${{ vars.TANKAI_EGRESS_DENIED_HOSTS }}
        run: ./scripts/deploy-public-cloudflare.sh
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tankai-public-deployment-receipt
          path: deployment-receipts/
          if-no-files-found: error
          retention-days: 30
